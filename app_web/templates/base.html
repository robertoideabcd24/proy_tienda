<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Tienda Online{% endblock %}</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #7B9FD5;
      --secondary-color: #f8f9fa;
    }
    
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #f4f4f4;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .navbar-custom {
      background-color: var(--primary-color);
    }
    
    .social-icon {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid white;
      border-radius: 50%;
      transition: all 0.3s ease;
    }
    
    .social-icon:hover {
      background-color: white;
      color: var(--primary-color) !important;
    }
    
    .search-box {
      max-width: 500px;
    }
    
    .user-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: white;
      color: var(--primary-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 5px;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Encabezado mejorado con Bootstrap -->
  <header class="navbar-custom text-white mb-4">
    <div class="container">
      <div class="row align-items-center py-3">
        <div class="col-md-12 text-center">
          <h1 class="mb-3 mb-md-0">Tienda Online</h1>
        </div>
      </div>
      
      <div class="row align-items-center py-2">
        <div class="col-md-6 mb-2 mb-md-0">
          <form class="d-flex search-box mx-auto">
            <input class="form-control me-2" type="search" placeholder="Buscar producto..." aria-label="Buscar">
            <button class="btn btn-light" type="submit">Buscar</button>
          </form>
        </div>
        
        <div class="col-md-6">
          <div class="d-flex flex-wrap justify-content-center justify-content-md-end gap-2">
            <a href="/ver_compras" class="btn btn-light btn-sm">
              <i class="fas fa-shopping-bag me-1"></i> Compras
            </a>
            
            {% if session.rol == 1 %}
              <a href="/consulta_stock" class="btn btn-light btn-sm">
                <i class="fas fa-boxes me-1"></i> Productos
              </a>
            {% endif %}
            
            {% if session.usuario %}
              <a href="/perfil_usuario" class="btn btn-light btn-sm">
                <span class="user-avatar">
                  {{ session.usuario|first|upper }}
                </span>
                {{ session.usuario }}
              </a>
            {% else %}
              <a href="/login" class="btn btn-light btn-sm">
                <i class="fas fa-sign-in-alt me-1"></i> Iniciar sesión
              </a>
            {% endif %}
            
            <a href="/ver_carrito" class="btn btn-light btn-sm position-relative">
              <i class="fas fa-shopping-cart me-1"></i> Carrito
              <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                <!-- Aquí podrías añadir el contador del carrito si lo tienes -->
              </span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="container flex-grow-1 mb-4">
    {% block content %}{% endblock %}
  </main>

  <!-- Pie de página mejorado -->
  <footer class="navbar-custom text-white py-4 mt-auto">
    <div class="container">
      <div class="row">
        <div class="col-12 text-center">
          <p class="mb-3">&copy; 2025 Tienda Online. Todos los derechos reservados.</p>
          <div class="d-flex justify-content-center gap-3">
            <a href="https://facebook.com" target="_blank" class="text-white social-icon">
              <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://twitter.com" target="_blank" class="text-white social-icon">
              <i class="fab fa-twitter"></i>
            </a>
            <a href="https://instagram.com" target="_blank" class="text-white social-icon">
              <i class="fab fa-instagram"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
