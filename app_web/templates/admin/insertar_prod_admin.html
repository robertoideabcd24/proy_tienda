{% extends "base.html" %}

{% block title %}Insertar Producto{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; height: 80vh;">
    <form method="POST" action="{{ url_for('insertar_producto') }}" style="border: 1px solid #ccc; padding: 30px; border-radius: 10px; background-color: #f9f9f9; width: 300px;">
        <h2 style="text-align: center;">Nuevo Producto</h2>
        <div style="margin-bottom: 15px;">
            <label for="nombre">Nombre:</label> 
            <input type="text" id="nombre" name="nombre" required style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label for="precio">Precio:</label>
            <input type="number" step="0.01" id="precio" name="precio" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="disponible">Disponible:</label>
            <input type="checkbox" id="disponible" name="disponible" style="margin-left: 10px;">
        </div>


        <div style="margin-bottom: 15px;">
            <label for="marca">Marca:</label>
            <input type="text" step="0.01" id="marca" name="marca" required style="width: 100%; padding: 8px;">
        </div>

         <div style="margin-bottom: 15px;">
            <label for="descripcion">Descripcion:</label>
            <input type="text" step="0.01" id="descripcion" name="descripcion" required style="width: 100%; padding: 8px;">
        </div>


        <button type="submit" style="width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px;">Guardar</button>

    </form>
</div>
{% endblock %}
