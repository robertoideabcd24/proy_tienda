{% extends "base.html" %}

{% block content %}
<div class="container mt-3 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <!-- Botón Volver fuera de la tarjeta -->
            <a href="{{ url_for('consulta_productos') }}" class="btn btn-light btn-sm mb-3">
                <i class="fas fa-arrow-left me-1"></i> Volver
            </a>
            
            <!-- Tarjeta de perfil -->
            <div class="card border-0 shadow">
                <div class="card-header bg-primary text-white" style="background-color: #7B9FD5 !important;">
                    <h5 class="mb-0 text-center">Mi Perfil</h5>
                </div>
                
                <div class="card-body">
                    <!-- Avatar centrado -->
                    <div class="text-center mb-4">
                        <div class="avatar-circle mb-3" style="background-color: #7B9FD5;">
                            <i class="fas fa-user fa-2x text-white"></i>
                        </div>
                    </div>
                    
                    <!-- Información alineada a la izquierda -->
                    <div class="mb-4 ps-3">
                        
                        
                        <div class="user-details">
                            <div class="mb-2">
                                <strong class="text-primary" style="color: #7B9FD5 !important;">Nombre:</strong>
                                <span class="ms-2">{{ usuario }}</span>
                            </div>
                            <div class="mb-2">
                                <strong class="text-primary" style="color: #7B9FD5 !important;">Correo:</strong>
                                <span class="ms-2">{{ correo }}</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Botón Cerrar Sesión -->
                    <div class="d-grid gap-2 mt-4">
                        <form action="{{ url_for('logout') }}" method="post">
                            <button type="submit" class="btn btn-danger w-100">
                                <i class="fas fa-sign-out-alt me-2"></i>Cerrar sesión
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .avatar-circle {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
    }
    
    .card {
        border-radius: 8px;
        overflow: hidden;
    }
    
    .card-header {
        padding: 1rem 1.25rem;
    }
    
    .user-details {
        background-color: #f8f9fa;
        padding: 1rem;
        border-radius: 6px;
    }
    
    .btn-light {
        background-color: #ffffff;
        color: #7B9FD5;
        border: 1px solid #dee2e6;
    }
    
    .btn-light:hover {
        background-color: #e6e6e6;
    }
</style>
{% endblock %}
