{% extends "base.html" %}

{% block title %}Detalles del Producto{% endblock %}

{% block content %}
<h2>Agregar detalles al producto #{{ producto_id }}</h2>
<form method="POST">
    <label for="talla">Talla:</label>
    <input type="text" name="talla" required><br>

    <label for="color">Color:</label>
    <input type="text" name="color" required><br>

    <label for="stock">Stock:</label>
    <input type="number" name="stock" min="0" required><br>

    <input type="submit" value="Agregar Detalles">
</form>
{% endblock %}
